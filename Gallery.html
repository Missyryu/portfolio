<script>
  const images = document.querySelectorAll('.slideshow-img');
  let currentIndex = 0;

  setInterval(() => {
    // 1. Fade out current image
    images[currentIndex].classList.remove('active');

    // 2. Wait 1 second (duration of CSS fade-out) before showing next image
    setTimeout(() => {
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active'); // Fade in next image
    }, 1000); 

  }, 4000); // Total cycle time per image (Display time + Fade time)
  
  function openNav() {
  document.getElementById("mySidepanel").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidepanel").style.width = "0";
}
</script>
